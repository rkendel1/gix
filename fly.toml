# fly.toml app configuration file generated for gix on 2026-07-11T02:55:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gix'
primary_region = 'fra'

[build]

[env]
  HEALTH_PORT = '8080'
  REPOSITORY_CACHE = '/data/repos'
  RUST_LOG = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[http_service.checks]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
