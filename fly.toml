# fly.toml app configuration file generated for gix on 2026-07-11T03:51:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gix'
primary_region = 'fra'

[build]

[env]
  COORDINATOR_URL = 'https://api.trythissoftware.com'
  HEALTH_PORT = '8080'
  REPOSITORY_CACHE = '/data/repos'
  RUST_LOG = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
