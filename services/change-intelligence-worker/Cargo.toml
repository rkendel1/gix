lints.workspace = true

[package]
name = "change-intelligence-worker"
description = "A standalone worker service for Git repository diff analysis using gix"
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
rust-version = "1.82"
publish = false

[[bin]]
name = "change-intelligence-worker"
path = "src/main.rs"
doc = false
doctest = false

[dependencies]
# Gitoxide dependencies for git operations
gix = { version = "^0.81.0", path = "../../gix", default-features = false, features = [
    "sha1",
    "blob-diff",
    "revision",
    "parallel",
    "index",
    "blocking-network-client",
    "blocking-http-transport-reqwest",
] }
gix-diff = { version = "^0.61.0", path = "../../gix-diff", features = ["blob"] }

# Async runtime and networking
tokio = { version = "1.45.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = { version = "0.8.4", features = ["json"] }
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Error handling and logging
anyhow = "1.0.98"
thiserror = "2.0.18"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Utilities
uuid = { version = "1.17.0", features = ["v4", "serde"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
sha2 = "0.10.8"
async-trait = "0.1.88"
